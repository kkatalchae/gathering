spring:
  config:
    activate:
      on-profile: test

  application:
    name: gathering

  # 테스트용 H2 인메모리 데이터베이스
  datasource:
    # LOCK_TIMEOUT: 동시성 테스트에서 FOR UPDATE 대기가 H2 기본값(1초)을 넘어 락 타임아웃으로 오탐하지 않도록 여유를 둔다
    url: jdbc:h2:mem:testdb;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # 테스트에서는 MySQL 전용 SQL 초기화 비활성화
  sql:
    init:
      mode: never

  # Thymeleaf 설정
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    check-template-location: true

  # OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: id
            client-secret: secret

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

crypto:
  aes:
    key: gatheringkey1234

jwt:
  secret: gatheringSecretKeyForJwtTokenGenerationMustBeLongEnoughForHS256Algorithm
  access-token-validity-in-seconds: 3600 # 1시간
  refresh-token-validity-in-seconds: 7776000 # 90일

file:
  upload:
    local-upload-path: /tmp/gathering-test-uploads
    url-prefix: /uploads
