<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gathering - 모임 플랫폼</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            color: white;
        }

        .logo { font-size: 1.8rem; font-weight: 700; }

        .auth-buttons { display: flex; gap: 12px; }

        .btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background: white; color: #0984e3; }
        .btn-primary { background: white; color: #0984e3; }
        .btn-primary:hover { background: #f0f0f0; }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 40px;
            max-width: 480px;
            line-height: 1.6;
        }

        .cta-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

        .btn-cta {
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-cta-primary {
            background: white;
            color: #0984e3;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .btn-cta-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.2); }

        .btn-cta-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .btn-cta-secondary:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }

        @media (max-width: 600px) {
            .header { padding: 16px 20px; }
            .hero-title { font-size: 2.4rem; }
        }
    </style>
</head>
<body>
<header class="header">
    <div class="logo">Gathering</div>
    <div class="auth-buttons">
        <button id="myInfoBtn" class="btn" style="display:none;" onclick="location.href='/my-info'">내 정보</button>
        <a id="loginBtn" href="/login" class="btn">로그인</a>
        <button id="logoutBtn" class="btn" style="display:none;">로그아웃</button>
    </div>
</header>

<main class="hero">
    <h1 class="hero-title">함께하는 즐거움</h1>
    <p class="hero-subtitle">관심사가 같은 사람들과 모임을 만들고<br>새로운 인연을 시작해보세요.</p>
    <div class="cta-buttons">
        <a href="/gatherings" class="btn-cta btn-cta-primary">모임 둘러보기</a>
        <a id="createCta" href="/gatherings/new" class="btn-cta btn-cta-secondary" style="display:none;">새 모임 만들기</a>
    </div>
</main>

<script>
    async function checkLoginStatus() {
        const accessToken = localStorage.getItem('accessToken');
        if (!accessToken) return;

        try {
            const response = await fetch('/users/me', {
                headers: {
                    'Accept': 'application/json',
                    'Authorization': `Bearer ${accessToken}`
                }
            });

            if (response.ok) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('myInfoBtn').style.display = 'inline-block';
                document.getElementById('createCta').style.display = 'inline-block';

                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await fetch('/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    localStorage.removeItem('accessToken');
                    location.reload();
                });
            }
        } catch (e) {
            console.log('Not logged in');
        }
    }

    // OAuth 로그인 성공 후 URL 파라미터 처리
    (function () {
        const params = new URLSearchParams(window.location.search);
        const accessToken = params.get('accessToken');
        if (accessToken) {
            localStorage.setItem('accessToken', accessToken);
            localStorage.setItem('tokenType', params.get('tokenType') || 'Bearer');
            window.history.replaceState({}, document.title, '/');
        }
    })();

    document.addEventListener('DOMContentLoaded', checkLoginStatus);
</script>
</body>
</html>
