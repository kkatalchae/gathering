spring:
  application:
    name: gathering

  # TODO: [운영 환경 배포 전 필수] Profile별 설정 파일 분리 필요
  #  - application-dev.yaml: 개발/로컬 공통 (현재 설정 이동, Git 커밋)
  #  - application-prod.yaml: 운영 전용 (환경변수 사용, Git 커밋)
  #  참고: dev와 local은 동일 프로파일 사용 (팀 동기화 편의성)

  # 데이터베이스 설정
  datasource:
    url: jdbc:mysql://localhost:3306/gathering_db
    username: gathering_user
    password: ${DATABASE_PASSWORD}
    # 드라이버 클래스 지정 (기본적으로 자동 설정되지만, 여러개인 경우 명시 필요)
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        useSSL: false # 개발 환경에서만 비활성화 처리
        serverTimezone: UTC
        allowPublicKeyRetrieval: true

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create # 개발할 때만 create, 운영시에는 validate 혹은 none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    # Hibernate DDL 완료 후 data.sql 실행 (순서 보장)
    defer-datasource-initialization: true

  # SQL 초기 데이터 설정
  sql:
    init:
      mode: always
      data-locations: classpath:data/regions_master_data.sql

  # Thymeleaf 설정
  thymeleaf:
    enabled: true # Thymeleaf 기능 켜기 (기본값 true)
    prefix: classpath:/templates/ # 템플릿 파일 위치
    suffix: .html # 템플릿 확장자
    mode: HTML # 템플릿 모드 (HTML, XML 등)
    cache: false # 개발시 캐시 비활성화
    check-template-location: true # 템플릿 위치 검증 여부

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Cassandra 설정 - 채팅 메시지/읽음 위치 (docs/adr/0002)
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: ${CASSANDRA_LOCAL_DATACENTER:datacenter1}
    keyspace-name: gathering
    schema-action: create_if_not_exists # 개발할 때만, 운영시에는 none + 스키마 관리 별도
    # 타임아웃 — 드라이버 기본값(request 2s, connect/init 5s)은 운영 클러스터 기준이다.
    # 로컬 Docker 는 힙을 줄여 띄우고 첫 요청에 스키마 생성·JIT 워밍업이 겹쳐 그보다 오래 걸릴 수 있어 넉넉히 둔다.
    # 운영에서는 장애 감지가 늦어지지 않도록 환경변수로 SLA 에 맞게 낮춘다.
    connection:
      connect-timeout: ${CASSANDRA_CONNECT_TIMEOUT:10s}
      init-query-timeout: ${CASSANDRA_INIT_QUERY_TIMEOUT:10s}
    request:
      timeout: ${CASSANDRA_REQUEST_TIMEOUT:10s}
    controlconnection:
      timeout: ${CASSANDRA_CONTROL_CONNECTION_TIMEOUT:10s}

  data:
    # 리액티브 Cassandra 리포지토리는 쓰지 않는다 — 스캔을 끄면 기동 로그의 모듈 배정 소음이 줄어든다
    cassandra:
      repositories:
        type: imperative
    # Redis 설정
    redis:
      host: localhost
      port: 6379
      password:  # 개발 환경에서는 비밀번호 없음 # TODO: [운영] ${REDIS_PASSWORD}로 변경
  # OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
crypto:
  aes:
    key: ${SECRET_KEY_AES}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity-in-seconds: 3600 # 1시간
  refresh-token-validity-in-seconds: 7776000 # 90일

file:
  upload:
    local-upload-path: uploads
    url-prefix: /uploads

